apiVersion: apps/v1
kind: Deployment
metadata:
  name: kasirsewa-whatsapp-gateway
  labels:
    app: kasirsewa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kasirsewa-whatsapp-gateway
  template:
    metadata:
      labels:
        app: kasirsewa-whatsapp-gateway
    spec:
      containers:
        - name: whatsapp-gateway
          image: kasirsewa/whatsapp-gateway:latest
          ports:
            - containerPort: 3001
          env:
            - name: WA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kasirsewa-secrets
                  key: wa_api_key
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: wa-auth-data
              mountPath: /.wwebjs_auth
      volumes:
        - name: wa-auth-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kasirsewa-whatsapp-gateway
  labels:
    app: kasirsewa
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
spec:
  selector:
    app: kasirsewa-whatsapp-gateway
  ports:
    - port: 80
      targetPort: 3001
      protocol: TCP
  type: ClusterIP