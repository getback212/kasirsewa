server {
    listen 80;
    # Accept only the SaaS apex and tenant subdomains. Tenant resolution is
    # performed by Laravel using the Host header; custom domains require TLS/DNS separately.
    server_name localhost superbackend.my.id *.superbackend.my.id;
    root /var/www/html/public;

    index index.php index.html;

    charset utf-8;

    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass kasirsewa_app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
