; KasirSewa FastCGI pool overrides.
;
; Files under php-fpm.d/ are included in alphabetical order, and this one is
; prefixed zz- so it is read after www.conf: every directive below overrides
; the stock value rather than fighting it.
;
; Note: keep `listen` on TCP (the stock 9000). A unix socket would be faster,
; but nginx and php-fpm live in separate containers here, so /run is not shared
; and nginx could not reach the socket file.

[www]

; 4 vCPU box. A Laravel worker sits around 40MB resident, so 6 children stay
; well inside the container budget (~240MB worst case) while giving enough
; parallelism to keep concurrent requests and the queue from exhausting the pool.
; (The old value of 5 was tuned for a smaller box; the actual page latency was
; never limited by this — see docs/performance.md.)
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Recycle workers periodically so a slow leak (or a stuck framework boot)
; cannot accumulate across days of uptime.
pm.max_requests = 500

catch_workers_output = yes
