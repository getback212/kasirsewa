; Opcache tuned for this codebase (~9.8k PHP files across app/ + vendor/).
;
; The stock max_accelerated_files is 10000, which sits right at the edge of the
; file count — once the cache fills, files get evicted and recompiled, so the
; win from opcache was being lost. 20000 leaves headroom; 16M of interned
; strings fits a framework this size, and 192M of shared memory holds the
; compiled bytecode of the whole tree without eviction.
;
; This file is loaded last (zz- prefix), so it wins over docker-php-ext-*.ini.

opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.save_comments=1
opcache.enable_file_override=1

; Local/dev boxes mount the source as a bind volume, so edited files must be
; picked up without a container restart. Drop the TTL on production images.
opcache.validate_timestamps=1
opcache.revalidate_freq=2
