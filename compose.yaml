name: kasirsewa

services:
  kasirsewa_app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: kasirsewa_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
      - ./docker/php/php-fpm.d/zz-kasirsewa.conf:/usr/local/etc/php-fpm.d/zz-kasirsewa.conf:ro
    environment:
      - CONTAINER_ROLE=app
      # WhatsApp gateway credentials. The gateway and every sender container
      # read WA_API_KEY from the same .env, so the dispatcher's Authorization
      # header always matches what the gateway expects. Without this the
      # billing reminders silently skip the WhatsApp channel.
      - WA_API_KEY=${WA_API_KEY:-baileys_free_gateway}
      - WA_GATEWAY_URL=${WA_GATEWAY_URL:-http://kasirsewa_whatsapp:3001/send}
    networks:
      - kasirsewa_network
    depends_on:
      - kasirsewa_pgsql
      - kasirsewa_redis

  kasirsewa_webserver:
    image: nginx:alpine
    container_name: kasirsewa_webserver
    restart: unless-stopped
    ports:
      - "8087:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - kasirsewa_network
    depends_on:
      - kasirsewa_app

  kasirsewa_pgsql:
    image: postgres:16-alpine
    container_name: kasirsewa_pgsql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kasirsewa_db}
      POSTGRES_USER: ${DB_USERNAME:-kasirsewa_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - kasirsewa_pgsql_data:/var/lib/postgresql/data
    networks:
      - kasirsewa_network

  kasirsewa_redis:
    image: redis:7-alpine
    container_name: kasirsewa_redis
    restart: unless-stopped
    volumes:
      - kasirsewa_redis_data:/data
    networks:
      - kasirsewa_network

  kasirsewa_queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: kasirsewa_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - .:/var/www/html
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
    environment:
      - WA_API_KEY=${WA_API_KEY:-baileys_free_gateway}
      - WA_GATEWAY_URL=${WA_GATEWAY_URL:-http://kasirsewa_whatsapp:3001/send}
    networks:
      - kasirsewa_network
    depends_on:
      - kasirsewa_app
      - kasirsewa_pgsql
      - kasirsewa_redis

  kasirsewa_whatsapp:
    build:
      context: ./whatsapp-gateway
    container_name: kasirsewa_whatsapp
    restart: unless-stopped
    environment:
      - WA_API_KEY=${WA_API_KEY:-baileys_free_gateway}
    ports:
      - "3001:3001"
    volumes:
      - kasirsewa_baileys_auth:/app/auth
    networks:
      - kasirsewa_network

  kasirsewa_scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: kasirsewa_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    environment:
      - TZ=Asia/Jakarta
      - WA_API_KEY=${WA_API_KEY:-baileys_free_gateway}
      - WA_GATEWAY_URL=${WA_GATEWAY_URL:-http://kasirsewa_whatsapp:3001/send}
    networks:
      - kasirsewa_network
    depends_on:
      - kasirsewa_app
      - kasirsewa_pgsql
      - kasirsewa_redis

networks:
  kasirsewa_network:
    driver: bridge

volumes:
  kasirsewa_pgsql_data:
  kasirsewa_redis_data:
  kasirsewa_baileys_auth:
